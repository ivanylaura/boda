const bin = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const desUrl = (s) => bin(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
const aUrl = (b) => btoa(String.fromCharCode(...b)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const NOMBRE = "boda-clave";

async function abrir(k, via) {
  const llave = await crypto.subtle.importKey("raw", k, "AES-GCM", false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bin(D.iv) }, llave, bin(D.ct)));
  try { localStorage.setItem(NOMBRE, aUrl(k)); } catch (e) {}
  try { sessionStorage.setItem(NOMBRE, aUrl(k)); } catch (e) {}
  window.__bodaClave = aUrl(k);
  try { if (!sessionStorage.getItem("boda-entrada")) sessionStorage.setItem("boda-entrada", via || ""); } catch (e) {}
  if (document.readyState === "loading") await new Promise((r) => addEventListener("DOMContentLoaded", r, { once: true }));
  await new Promise((r) => setTimeout(r, 0));
  document.open(); document.write(html); document.close();
}

async function conPassword(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const kpw = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bin(D.sal), iterations: D.it, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new Uint8Array(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bin(D.iv2) }, kpw, bin(D.wk)));
}

(async () => {
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  let guardada = null; try { guardada = localStorage.getItem(NOMBRE); } catch (e) {}
  for (const [c, via] of [[m && m[1], "QR o enlace"], [guardada, "recordada"]]) {
    if (!c) continue;
    try { await abrir(desUrl(c), via); return; } catch (e) {}
  }
  try { localStorage.removeItem(NOMBRE); } catch (e) {}
  document.body.classList.remove("cargando");
  if (!window.crypto || !crypto.subtle) document.getElementById("err").textContent = "Abre esta página con https.";
})();

document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("entrar"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Entrando…"; err.textContent = "";
  try { await abrir(await conPassword(document.getElementById("pw").value.trim()), "contraseña"); }
  catch (x) { err.textContent = "Contraseña incorrecta. Revisa mayúsculas y minúsculas."; btn.disabled = false; btn.textContent = "Entrar"; }
});
